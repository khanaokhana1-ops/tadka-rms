<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">


<script src="../js/admin-nav.js"></script>
    <div class="topbar">
      <h1>Dashboard</h1>
      <button class="btn btn-secondary" onclick="logout()">Log out</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Restaurant info & settings</h3>

      <label>Restaurant name</label>
      <input type="text" id="f_name">

      <label>Tagline</label>
      <input type="text" id="f_tagline">

      <label>Address</label>
      <textarea id="f_address"></textarea>

      <label>Primary phone</label>
      <input type="text" id="f_phone1">

      <label>Secondary phone (optional)</label>
      <input type="text" id="f_phone2">

      <label>Email</label>
      <input type="email" id="f_email">

      <label>Opening hours</label>
      <input type="text" id="f_hours" placeholder="e.g. 11:00 AM - 11:00 PM">

      <div class="checkbox-row">
        <input type="checkbox" id="f_open">
        <label style="margin:0;">Currently open for orders</label>
      </div>

      <label>Delivery fee (₹)</label>
      <input type="number" id="f_delivery_fee">

      <label>Free delivery above (₹)</label>
      <input type="number" id="f_free_above">

      <label>Tax rate (e.g. 0.05 for 5%)</label>
      <input type="number" step="0.01" id="f_tax">

      <label>Logo</label>
      <input type="file" id="f_logo_file" accept="image/*">
      <img id="logo_preview" class="preview" style="display:none;">

      <button class="btn" onclick="saveRestaurant()">Save changes</button>
      <p class="success" id="saved_msg" style="display:none;">Saved! Your website is now updated.</p>
      <p class="error" id="save_error"></p>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Manage your restaurant</h3>
      <p style="font-size:14px; color:#8A837A;">More sections (menu, categories, banners, offers) will appear here soon.</p>
    </div>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script>
    let currentLogoUrl = null;

    async function loadData() {
      await requireAuth();
      const { data, error } = await supabaseClient.from('restaurant').select('*').eq('id', 1).single();
      if (error) { document.getElementById('save_error').textContent = error.message; return; }
      document.getElementById('f_name').value = data.name || '';
      document.getElementById('f_tagline').value = data.tagline || '';
      document.getElementById('f_address').value = data.address || '';
      document.getElementById('f_phone1').value = data.phone_primary || '';
      document.getElementById('f_phone2').value = data.phone_secondary || '';
      document.getElementById('f_email').value = data.email || '';
      document.getElementById('f_hours').value = data.opening_hours || '';
      document.getElementById('f_open').checked = !!data.is_open;
      document.getElementById('f_delivery_fee').value = data.delivery_fee ?? 40;
      document.getElementById('f_free_above').value = data.free_delivery_above ?? 499;
      document.getElementById('f_tax').value = data.tax_rate ?? 0.05;
      currentLogoUrl = data.logo_url || null;
      if (currentLogoUrl) {
        const img = document.getElementById('logo_preview');
        img.src = currentLogoUrl;
        img.style.display = 'block';
      }
    }

    async function saveRestaurant() {
      document.getElementById('save_error').textContent = '';
      document.getElementById('saved_msg').style.display = 'none';

      const file = document.getElementById('f_logo_file').files[0];
      let logoUrl = currentLogoUrl;

      if (file) {
        const fileName = `logo-${Date.now()}-${file.name}`;
        const { error: uploadError } = await supabaseClient.storage.from('images').upload(fileName, file, { upsert: true });
        if (uploadError) {
          document.getElementById('save_error').textContent = 'Image upload failed: ' + uploadError.message;
          return;
        }
        const { data: urlData } = supabaseClient.storage.from('images').getPublicUrl(fileName);
        logoUrl = urlData.publicUrl;
      }

      const payload = {
        name: document.getElementById('f_name').value,
        tagline: document.getElementById('f_tagline').value,
        address: document.getElementById('f_address').value,
        phone_primary: document.getElementById('f_phone1').value,
        phone_secondary: document.getElementById('f_phone2').value,
        email: document.getElementById('f_email').value,
        opening_hours: document.getElementById('f_hours').value,
        is_open: document.getElementById('f_open').checked,
        delivery_fee: Number(document.getElementById('f_delivery_fee').value),
        free_delivery_above: Number(document.getElementById('f_free_above').value),
        tax_rate: Number(document.getElementById('f_tax').value),
        logo_url: logoUrl,
        updated_at: new Date().toISOString(),
      };

      const { error } = await supabaseClient.from('restaurant').update(payload).eq('id', 1);
      if (error) {
        document.getElementById('save_error').textContent = error.message;
        return;
      }
      currentLogoUrl = logoUrl;
      document.getElementById('saved_msg').style.display = 'block';
    }

    loadData();
  </script>
</body>
</html>
